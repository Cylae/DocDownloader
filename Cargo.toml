[package]
name = "docdownloader"
version = "0.1.0"
edition = "2021"
authors = ["DocDownloader Contributors"]
description = "Robust, high-performance document extraction and offline reconstruction engine"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "stream", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lopdf = { version = "0.34", features = ["embed_image"] }
sha2 = "0.10"
hex = "0.4"
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
console = "0.15"
tempfile = "3.17"
regex = "1.11"
async-trait = "0.1"
async-stream = "0.3"
futures-util = "0.3"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "set-header"] }

[dev-dependencies]
wiremock = "0.6"
proptest = "1.6"

[[bench]]
name = "synthetic_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
